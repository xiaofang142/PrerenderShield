server:
    address: 0.0.0.0
    api_port: 19598
    console_port: 19597
dirs:
    data_dir: ./data
    static_dir: ./static
    certs_dir: ./certs
    admin_static_dir: ./web
cache:
    type: redis
    redis_url: localhost:6379
    redis_password: ""
    redis_db: 0
    memory_size: 1000
storage:
    type: redis
monitoring:
    enabled: true
    prometheus_address: :9090
app:
    version: 1.0.1
    official_url: https://prerender.websitetool.cn
sites:
    - id: test-site1
      name: updated-test-site
      domains:
        - localhost
        - 127.0.0.1
      port: 8084
      mode: static
      proxy:
        target_url: ""
      redirect:
        status_code: 0
        target_url: ""
      firewall:
        enabled: true
        rules_path: ./rules
        action:
            default_action: block
            block_message: Request blocked by firewall
        geoip:
            enabled: false
            allow_list: []
            block_list: []
        rate_limit:
            enabled: true
            requests: 100
            window: 60
            ban_time: 3600
        blacklist: []
        whitelist: []
      prerender:
        enabled: true
        pool_size: 3
        min_pool_size: 1
        max_pool_size: 10
        timeout: 30
        cache_ttl: 3600
        idle_timeout: 300
        dynamic_scaling: true
        scaling_factor: 0.5
        scaling_interval: 60
        preheat:
            enabled: false
            sitemap_url: ""
            schedule: 0 0 * * *
            concurrency: 5
            default_priority: 0
            max_depth: 3
        push:
            enabled: false
            baidu_api: http://data.zz.baidu.com/urls
            baidu_token: ""
            bing_api: https://ssl.bing.com/webmaster/api.svc/json/SubmitUrl
            bing_token: ""
            baidu_daily_limit: 1000
            bing_daily_limit: 1000
            push_domain: ""
        crawler_headers:
            - Googlebot
            - Bingbot
            - Baiduspider
        use_default_headers: true
      routing:
        rules: []
      file_integrity:
        enabled: false
        check_interval: 300
        hash_algorithm: sha256
