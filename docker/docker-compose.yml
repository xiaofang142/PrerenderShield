version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: prerender-shield-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - prerender-shield-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: prerender-shield-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "9598:9598"
      - "9597:9597"
    shm_size: 256m
    mem_limit: 4g
    security_opt:
      - seccomp:unconfined
    volumes:
      - app-data:/app/data
      - app-static:/app/static
      - ./config.yml:/app/config.yml:ro
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
      - REDIS_URL=redis://redis:6379/0
      - PRERENDER_MAX_INSTANCES=3
      - PRERENDER_MIN_INSTANCES=1
      - PRERENDER_WORKER_COUNT=3
    networks:
      - prerender-shield-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9598/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 可选：Nginx反向代理（提供SSL终止和域名访问）
  nginx:
    image: nginx:1.25-alpine
    container_name: prerender-shield-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../deploy/nginx/prerender-shield.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-certs:/etc/letsencrypt
    depends_on:
      - api
    networks:
      - prerender-shield-network
    profiles:
      - with-nginx

networks:
  prerender-shield-network:
    driver: bridge
    name: prerender-shield-network

volumes:
  redis-data:
    name: prerender-shield-redis-data
  app-data:
    name: prerender-shield-app-data
  app-static:
    name: prerender-shield-app-static
  nginx-certs:
    name: prerender-shield-nginx-certs
