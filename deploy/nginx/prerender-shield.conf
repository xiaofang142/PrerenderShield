# Prerender Shield Nginx 配置
# 前置代理模式 - 统一80/443端口入口

upstream prerender_api {
    server 127.0.0.1:9598;
    # server 127.0.0.1:9598 backup;  # 多实例
}

upstream prerender_console {
    server 127.0.0.1:9597;
}

upstream prerender_sites {
    # 站点服务器自动映射，每站点独立端口
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
}

server {
    listen 80;
    server_name shield.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shield.example.com;

    ssl_certificate     /etc/letsencrypt/live/shield.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shield.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 管理控制台
    location / {
        proxy_pass http://prerender_console;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 服务
    location /api/ {
        proxy_pass http://prerender_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 站点转发（按域名）
    location /sites/ {
        proxy_pass http://prerender_sites;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus 指标（内网访问）
    location /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://127.0.0.1:9090/metrics;
    }

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?)$ {
        proxy_pass http://prerender_console;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
