name: Release

# 推送 v* 标签时触发：交叉编译四平台二进制 → 打包示例配置与快速入门 → 上传 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.25.0'
  NODE_VERSION: '20.x'

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 管理控制台前端静态资源随包分发（bin/web，由 dirs.admin_static_dir 指向）
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Go cross compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 go build -ldflags "-s -w" -trimpath -o "dist/${{ matrix.goos }}_${{ matrix.goarch }}/api" ./cmd/api
          mkdir -p "dist/${{ matrix.goos }}_${{ matrix.goarch }}/web" "dist/${{ matrix.goos }}_${{ matrix.goarch }}/configs" "dist/${{ matrix.goos }}_${{ matrix.goarch }}/docs"
          cp -r web/dist/. "dist/${{ matrix.goos }}_${{ matrix.goarch }}/web/"
          cp configs/config.example.yml "dist/${{ matrix.goos }}_${{ matrix.goarch }}/configs/"
          cp docs/QUICK_START_GUIDE.md "dist/${{ matrix.goos }}_${{ matrix.goarch }}/docs/"

      - name: Package tarball (compatible with install.sh naming)
        working-directory: dist
        run: |
          cd "${{ matrix.goos }}_${{ matrix.goarch }}"
          # 包内根目录为 api，与 install.sh 二进制模式 `tar xzf && chmod +x api` 约定一致
          tar -czf "../prerender-shield_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" api web configs docs
          cd ..
          sha256sum "prerender-shield_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" >> ../sha256sums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prerender-shield_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/prerender-shield_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify checksum manifest
        working-directory: artifacts
        run: |
          cat sha256sums.txt
          sha256sum -c sha256sums.txt

      - name: Create Release and upload
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            artifacts/prerender-shield_*.tar.gz
            artifacts/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
