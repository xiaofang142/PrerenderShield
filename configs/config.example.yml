# PrerenderShield 配置文件

# 服务器配置
server:
  address: "0.0.0.0"
  api_port: 9598
  console_port: 9597
  # API 公网地址，用于控制台前端访问 API
  public_api_url: "${API_PUBLIC_URL:-http://localhost:9598}"

# 目录配置
dirs:
  data_dir: ./data
  static_dir: ./static
  certs_dir: ./certs
  admin_static_dir: ./web

# 缓存配置
cache:
  type: "redis"
  # Redis 连接配置，支持环境变量替换
  redis_url: "localhost:6379"
  memory_size: 1000

# 站点配置
sites:
  - id: "site1"
    name: "example-site"
    domains:
      - "example.com"
    port: 8082
    mode: "static"
    proxy:
      target_url: ""
    redirect:
      status_code: 0
      target_url: ""
    firewall:
      enabled: false
      rules_path: "./rules"
      action:
        default_action: "block"
        block_message: "Request blocked by firewall"
      geoip:
        enabled: false
        allow_list: []
        block_list: []
      rate_limit:
        enabled: false
        requests: 100
        window: 60
        ban_time: 3600
    prerender:
      enabled: true
      pool_size: 5
      min_pool_size: 2
      max_pool_size: 20
      timeout: 30
      cache_ttl: 3600
      idle_timeout: 300
      dynamic_scaling: true
      scaling_factor: 0.5
      scaling_interval: 60
      preheat:
        enabled: false
        sitemap_url: ""
        schedule: "0 0 * * *"
        concurrency: 5
        default_priority: 0
        max_depth: 3
      push:
        enabled: false
        baidu_api: "http://data.zz.baidu.com/urls"
        baidu_token: ""
        bing_api: "https://ssl.bing.com/webmaster/api.svc/json/SubmitUrl"
        bing_token: ""
        baidu_daily_limit: 1000
        bing_daily_limit: 1000
        push_domain: ""
        hour: 1
      crawler_headers:
        - "Googlebot"
        - "Bingbot"
        - "Baiduspider"
      use_default_headers: false
    routing:
      rules: []
    file_integrity:
      enabled: false
      check_interval: 300
      hash_algorithm: "sha256"

# SSL 证书配置（Let's Encrypt 自动申请）
ssl:
  enabled: false  # 是否启用 SSL 自动申请
  auto_renew: true  # 自动续签
  email: "your-email@example.com"  # ACME 账户邮箱
  production: false  # false=使用测试环境，true=使用生产环境（Let's Encrypt）
  http_port: 80  # HTTP-01 挑战监听端口
  check_interval: 24h  # 检查间隔
  renew_before_days: 30  # 提前多少天续签
  max_retries: 3  # 最大重试次数
  retry_delay: 1h  # 重试间隔
  webhook_url: ""  # 通知 Webhook URL
  # DNS 配置（用于 DNS-01 挑战，申请通配符证书必需）
  dns:
    provider: ""  # DNS 服务商：cloudflare, aliyun, tencentcloud, aws 等
    credentials:
      # Cloudflare: CLOUDFLARE_DNS_API_TOKEN: "your-token"
      # 阿里云：ALIBABA_CLOUD_ACCESS_KEY_ID: "xxx", ALIBABA_CLOUD_ACCESS_KEY_SECRET: "xxx"
      # 腾讯云：TENCENTCLOUD_SECRET_ID: "xxx", TENCENTCLOUD_SECRET_KEY: "xxx"

# 监控配置
monitoring:
  enabled: true
  prometheus_address: ":9090"
  # 告警规则配置文件路径
  alerting:
    enabled: true
    rules_path: "configs/alert-rules.json"
    # 通知配置
    notifications:
      webhook:
        enabled: false
        url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
        secret: ""
      email:
        enabled: false
        smtp_host: "smtp.example.com"
        smtp_port: 587
        username: "your-email@example.com"
        password: "your-password"
        from: "Prerender Shield <noreply@example.com>"
        to:
          - "admin@example.com"
  # 监控数据持久化配置
  metrics_persistence:
    enabled: true
    interval: 300        # 持久化间隔（秒），默认 5 分钟
    retention_hours: 24  # 数据保留时间（小时），默认 24 小时
    aggregate_enabled: true
    aggregate_interval: 3600  # 聚合间隔（秒），默认 1 小时
